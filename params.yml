# ============================================
# INPUT PATHS 
# ============================================
genex_fastq: '/path/to/gene_expression_fastqs'
crispr_fastq: '/path/to/crispr_fastqs'
reference: '/path/to/refdata-cellranger-arc-GRCh38-2020-A-2.0.0'
feature_reference: '/path/to/feature_reference.csv'

# ============================================
# SAMPLE IDs 
# ============================================
genex_sample_id: 'SC3_v3_NextGem_DI_CRISPR_A549_5K_gex'
crispr_sample_id: 'SC3_v3_NextGem_DI_CRISPR_A549_5K_crispr'

# ============================================
# OUTPUT CONFIGURATION
# ============================================
outdir: './results'
cellranger_id: 'my_experiment'

# ============================================
# CELL RANGER PARAMETERS
# ============================================
expect_cells: 5000
create_bam: false
cellranger_path: 'cellranger'

# ============================================
# RESOURCE ALLOCATION
# ============================================
max_cpus: 12
max_memory: '15.GB'
max_time: '48.h'

# ============================================
# PUBLISHING & QC OPTIONS
# ============================================
publish_dir_mode: 'copy'
skip_fastqc: false
skip_multiqc: false

# ============================================
# CONTAINER CONFIGURATION
# ============================================
container_registry: 'ddelgadillo'